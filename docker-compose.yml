services:
  # ==========================================
  # PostgreSQL Database
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: nsac_jember_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-hackathon_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-hackathon_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bot_network

  # ==========================================
  # Discord Bot & Web Dashboard
  # ==========================================
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nsac_jember_bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      CLIENT_ID: ${CLIENT_ID}
      GUILD_ID: ${GUILD_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DASHBOARD_BASE_URL: ${DASHBOARD_BASE_URL:-http://157.66.34.38:8080}
      PORT: ${PORT:-8080}
      MIN_TEAM_SIZE: ${MIN_TEAM_SIZE:-2}
      MAX_TEAM_SIZE: ${MAX_TEAM_SIZE:-6}
      INVITATION_EXPIRE_HOURS: ${INVITATION_EXPIRE_HOURS:-24}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-hackathon_db}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bot_network

volumes:
  postgres_data:
    driver: local

networks:
  bot_network:
    driver: bridge
